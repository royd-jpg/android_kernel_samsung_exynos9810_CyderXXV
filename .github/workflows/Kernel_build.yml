name: Build Exynos9810 Kernel — KSU-Next + SUSFS

on:
  # Run on every push to main/lineage_ksu
  push:
    branches: [main, lineage_ksu, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"

  # Run on PRs targeting those branches
  pull_request:
    branches: [main, lineage_ksu, master]

  # Allow manual trigger with device selection
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        required: true
        default: starlte
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte
      clean_build:
        description: "Clean out/ before building"
        required: false
        default: "false"
        type: boolean
      release:
        description: "Create a GitHub Release with the artifact"
        required: false
        default: "false"
        type: boolean

# Allow only one concurrent run per branch; cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.device || 'starlte' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ inputs.device || 'starlte' }})
    runs-on: ubuntu-22.04

    # Build a matrix across all three devices on push to main/lineage_ksu;
    # single device on manual dispatch
    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.device)) || fromJson('["starlte","star2lte","crownlte"]') }}

    steps:
      # ── 1. Checkout THIS repo (contains build scripts) ────────────────────
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: builder

      # ── 2. System dependencies ────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            git libssl-dev libelf-dev lz4 make ninja-build \
            patch python3 python3-pip unzip wget zip \
            llvm lld clang \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # ── 3. Cache toolchains ───────────────────────────────────────────────
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: builder/workspace/toolchain
          key: toolchain-protonclang-gcc49-lineage190-v1
          restore-keys: |
            toolchain-protonclang-gcc49-

      # ── 4. Cache kernel source ────────────────────────────────────────────
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: builder/workspace/kernel
          key: kernel-${{ github.sha }}
          restore-keys: |
            kernel-

      # ── 5. Apply build fixes ──────────────────────────────────────────────
      - name: Apply build fixes
        working-directory: builder
        run: |
          python3 - <<'PYEOF'
          import re, shutil, sys, urllib.request
          from pathlib import Path

          GREEN="\033[92m"; YELLOW="\033[93m"; RED="\033[91m"; NC="\033[0m"
          def info(m): print(f"{GREEN}[INFO]{NC}  {m}")
          def warn(m): print(f"{YELLOW}[WARN]{NC}  {m}")
          def err(m):  print(f"{RED}[ERR]{NC}   {m}", file=sys.stderr)

          build_py = Path("build.py")
          if not build_py.exists():
              err("build.py not found"); sys.exit(1)

          shutil.copy2(build_py, "build.py.bak")
          info("Backed up build.py")
          src = build_py.read_text()

          # ── 1. Inject fs/Makefile ccflags fix (runs after kernel clone) ──
          GUARD1 = "# KSU_CCFLAG_FIX"
          ANCHOR = '("✅  KernelSU-Next applied.")'
          CODE1 = '''
          # KSU_CCFLAG_FIX
          _mk = KERNEL_DIR / "fs" / "Makefile"
          _flag = "ccflags-y += -I$(srctree)/drivers/kernelsu\\n"
          if _mk.exists():
              _t = _mk.read_text()
              if _flag.strip() not in _t:
                  _ls = _t.splitlines(keepends=True)
                  _i = next((i+1 for i,l in enumerate(_ls) if l.strip().startswith("ccflags-y")), 0)
                  _ls.insert(_i, _flag)
                  _mk.write_text("".join(_ls))
                  log.info("ksu_hook.h: added ccflags to fs/Makefile")
              else:
                  log.info("ksu_hook.h: ccflags already present")
          else:
              log.warning("ksu_hook.h: fs/Makefile not found, skipping")
          '''
          if GUARD1 in src:
              warn("Makefile fix already present — skipping")
          elif ANCHOR in src:
              lines = src.splitlines(keepends=True)
              idx = next(i for i,l in enumerate(lines) if ANCHOR in l)
              lines.insert(idx+1, CODE1)
              src = "".join(lines)
              info("Patch 1: fs/Makefile ccflag fix injected into build.py")
          else:
              warn("Could not find KernelSU-Next anchor — Makefile fix skipped")

          # ── 2. Fix broken SUSFS URL ───────────────────────────────────────
          GUARD2 = "# SUSFS_URL_OK"
          CANDIDATES = [
              "https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/kernel_patches/50_add_susfs_in_kernel-1.5.7.patch",
              "https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/kernel_patches/50_add_susfs_in_kernel.patch",
              "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/susfs/50_add_susfs_in_kernel-1.5.7.patch",
          ]

          def probe(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"fix/2"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      d = r.read(4096).decode("utf-8","replace")
                  return "diff --git" in d or "\n---" in d
              except: return False

          if GUARD2 in src:
              warn("SUSFS URL already fixed — skipping")
          else:
              good = None
              for u in CANDIDATES:
                  info(f"Trying SUSFS URL: {u}")
                  if probe(u): good = u; info("  ✓ Valid"); break
                  else: warn("  ✗ Not valid")
              if good:
                  pat = re.compile(r'https?://\S+(?:susfs|SUSFS|galaxybuild)\S+\.patch')
                  m = pat.search(src)
                  if m:
                      old = m.group(0).rstrip("'\")")
                      src = src.replace(old, good + f"  {GUARD2}", 1)
                      info(f"Patch 2: SUSFS URL replaced\n  OLD: {old}\n  NEW: {good}")
                  else:
                      warn("Could not find existing SUSFS URL in build.py")
              else:
                  warn("No working SUSFS URL found — leaving as-is")

          # ── 3. Inject SUSFS patch validation ─────────────────────────────
          GUARD3 = "# SUSFS_VALID"
          ANCHOR3 = '("✅  SUSFS patch applied.")'
          CODE3 = '''
          # SUSFS_VALID
          _sp = workspace / "susfs.patch"
          if not _sp.exists() or _sp.stat().st_size < 100:
              log.error(f"SUSFS patch missing/invalid ({_sp.stat().st_size if _sp.exists() else 0} bytes)")
              raise SystemExit(1)
          _h = _sp.read_text(errors="replace")[:512]
          if "diff --git" not in _h and "\\n---" not in _h:
              log.error(f"SUSFS patch is not a valid diff: {_h[:200]!r}")
              raise SystemExit(1)
          log.info("SUSFS patch validated OK")
          '''
          if GUARD3 in src:
              warn("SUSFS validation already present — skipping")
          elif ANCHOR3 in src:
              lines = src.splitlines(keepends=True)
              idx = next(i for i,l in enumerate(lines) if ANCHOR3 in l)
              lines.insert(idx, CODE3)
              src = "".join(lines)
              info("Patch 3: SUSFS validation injected into build.py")
          else:
              warn("Could not find SUSFS success marker — validation skipped")

          build_py.write_text(src)
          info("build.py saved. All patches applied.")
          PYEOF

      # ── 6. Run build script ───────────────────────────────────────────────
      - name: Build kernel (${{ matrix.device }})
        working-directory: builder
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          CLEAN_FLAG=""
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            CLEAN_FLAG="--clean"
          fi
          python3 build.py --device "$DEVICE" $CLEAN_FLAG

      # ── 7. Verify artifact ────────────────────────────────────────────────
      - name: Verify artifact
        working-directory: builder
        run: |
          ZIP=$(ls dist/Exynos9810-${{ matrix.device }}-*.zip 2>/dev/null | tail -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No flashable zip found in dist/"
            exit 1
          fi
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "ZIP_NAME=$(basename $ZIP)" >> $GITHUB_ENV
          ls -lh dist/
          cat dist/build_meta.json

      # ── 8. Upload artifact ────────────────────────────────────────────────
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: builder/dist/${{ env.ZIP_NAME }}
          retention-days: 30
          compression-level: 0

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build_meta-${{ matrix.device }}
          path: builder/dist/build_meta.json
          retention-days: 30

      # ── 9. Create GitHub Release (manual dispatch only) ───────────────────
      - name: Create GitHub Release
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.release == 'true' &&
          github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ksu-susfs-${{ matrix.device }}-${{ github.run_number }}"
          name: "Exynos9810 ${{ matrix.device }} KSU-Next+SUSFS #${{ github.run_number }}"
          body: |
            ## Exynos9810 KernelSU-Next + SUSFS Kernel

            **Device**: ${{ matrix.device }}
            **Source**: ${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}
            **KernelSU**: KernelSU-Next (rifsxd)
            **SUSFS**: v1.5.7+

            ### Flash Instructions
            #### Method A — TWRP (recommended)
            1. Boot into TWRP recovery
            2. Flash the zip via **Install** → select zip → **Swipe to Flash**
            3. Reboot system

            #### Method B — ADB Sideload
              ```bash
                          adb sideload <zip>
              ```
              
                          #### Method C — Heimdall (Download Mode)
              ```bash
                          python3 flash.py --method heimdall --zip <zip>
              ```
              
                          ### Post-Flash
                          - Install the **KernelSU-Next Manager** APK
                          - Flash the **susfs4ksu** module via KSU Manager
              
                          > ⚠️ Backup your data. Rooting voids warranty.
          files: builder/dist/${{ env.ZIP_NAME }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Notify on failure ─────────────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-22.04
    needs: build
    if: failure()
    steps:
      - name: Print failure summary
        run: |
          echo "::error::Kernel build failed for one or more devices."
          echo "Check the individual job logs for details."
